<style>
:root{--g1:#33403A;--g2:#4F6355;--acc:#709481;--acc2:#AEC0AC;--beige:#DCD6C4;--ink:#26302b;--mut:#75827a;--card:#ffffff;--green:#2e9e63;--amber:#c77c1c;--line:#e6eae6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Azoft Sans','Segoe UI',Roboto,-apple-system,sans-serif;background:#fff;color:var(--ink)}
header{background:linear-gradient(135deg,var(--g1) 0%,var(--g2) 100%);color:#fff;padding:calc(14px + env(safe-area-inset-top)) 18px 16px}
header h1{font-size:24px;font-weight:800;margin:0;letter-spacing:.3px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:12px 2px;font-size:12.5px;font-weight:700;color:var(--mut);border-bottom:3px solid transparent;line-height:1}
.tab .ico{font-size:16px;line-height:1;transform:translateY(1px)}
.tab.on{color:var(--g1);border-color:var(--g1)}
main{padding:16px 16px calc(30px + env(safe-area-inset-bottom))}
.section{display:none}.section.on{display:block}
h2{font-size:19px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(51,64,58,.06)}
.mealrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eef2ee}
.mealrow:last-child{border:none}
.mealrow .info{flex:1}.mealrow b{font-size:15px}
.mealrow .tag{font-size:11px;color:var(--mut);display:block;margin-top:2px}
.mealrow .del{color:#b5544d;font-size:18px;padding:4px 6px;flex:none}
.chkbx{width:28px;height:28px;border-radius:9px;border:2px solid var(--acc2);flex:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#fff}
.chkbx.on{background:var(--g2);border-color:var(--g2)}
.daykcal{font-size:13px;color:var(--mut);margin:8px 0 4px}
.exp{display:none;padding:10px 12px;background:#f4f6f3;border-radius:10px;margin:8px 0 2px;font-size:14px}
.exp.on{display:block}
.exp .ing{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0}
.exp .steps{margin:4px 0 0;padding-left:18px}.exp .steps li{margin-bottom:6px}
.addrow{margin-top:10px}
.addrow button{background:#fff;border:2px dashed var(--acc);color:var(--g2);border-radius:12px;padding:9px 14px;font-size:13.5px;font-weight:700;width:100%;font-family:inherit}
.scanbox .srow{display:flex;gap:10px;margin-top:10px}
.scanbox .srow .btn{font-size:13.5px;padding:11px 8px}
.swapbtn{margin-bottom:12px;padding:10px;font-size:13.5px;font-weight:700}
.vgrid{display:grid;grid-template-columns:1fr;gap:12px}
.dy{font-size:16px;margin:16px 0 8px}.dy:first-child{margin-top:2px}
.tdy{background:var(--g2);color:#fff;font-size:11px;border-radius:12px;padding:3px 9px;vertical-align:middle}
.vcard{border-radius:16px;overflow:hidden;box-shadow:0 3px 12px rgba(51,64,58,.13);margin-bottom:12px}
.vhead{padding:16px;color:#fff;cursor:pointer}
.vhead .t{font-size:16.5px;font-weight:800}.vhead .s{font-size:13px;opacity:.92;margin-top:3px}
.vhead .pl{margin-top:10px;font-size:13px;background:rgba(255,255,255,.22);display:inline-block;padding:5px 12px;border-radius:20px}
.vframe{display:none;background:#000}.vframe.on{display:block}
.vframe iframe{width:100%;height:220px;border:0;display:block}
.filterbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px}
.fbtn{padding:7px 14px;border-radius:20px;background:#fff;color:var(--mut);font-size:13px;font-weight:700;white-space:nowrap;border:1px solid var(--line)}
.fbtn.on{background:var(--g1);color:#fff;border-color:var(--g1)}
.rec{overflow:hidden;padding:0}
.rhead{height:86px;display:flex;align-items:center;justify-content:center}
.rhead .re{font-size:44px}
.rbody{padding:12px 14px}
.rec .kcal{color:var(--mut);font-size:13px}
.rec .steps li{margin-bottom:7px;font-size:14.5px}
.rec .ing{font-size:14px;background:#f4f6f3;border-radius:10px;padding:8px 12px;margin:8px 0}
.startrow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
input[type=date],select,input[type=text]{padding:10px;border-radius:12px;border:1px solid var(--acc2);font-size:15px;background:#fff;font-family:inherit}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0}
.cel{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}
.cel .dot{width:6px;height:6px;border-radius:50%;margin-top:2px;background:transparent}
.cel .dot.done{background:var(--green)}.cel .dot.part{background:var(--amber)}
.cel.today{border-color:var(--g1);border-width:2px}
.cel.sel{background:var(--g2);color:#fff}
.monrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.monrow button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-size:16px;font-family:inherit}
.monrow b{font-size:15px}
.stat3{display:flex;gap:10px;margin-bottom:12px}
.stat3 .card{flex:1;text-align:center;margin:0;padding:12px 6px}
.stat3 b{font-size:22px;color:var(--g2);display:block}
.stat3 span{font-size:11px;color:var(--mut)}
.btn{display:block;width:100%;padding:13px;border-radius:13px;border:0;font-size:15px;font-weight:800;text-align:center;cursor:pointer;font-family:inherit}
.bprim{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.bsec{background:#fff;color:var(--g2);border:2px solid var(--g2)}
.backupbox{background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:16px;padding:16px;color:#fff;margin-top:16px}
.backupbox h3{margin:0 0 6px;font-size:16px}
.backupbox p{font-size:13px;opacity:.9;margin:0 0 10px}
.backupbox .bsec{border-color:#fff;color:#fff;background:rgba(255,255,255,.14);margin-top:8px}
.lastbk{font-size:12px;opacity:.85;margin-top:8px}
input[type=file]{display:none}
.note{font-size:13px;color:var(--mut)}
.warn{font-size:13px;color:#8a5a13;background:#faf3e2;border-radius:10px;padding:9px 12px;margin-top:10px}
.okbox{font-size:13px;color:#276749;background:#eaf4ec;border-radius:10px;padding:9px 12px;margin-top:10px}
.vcard2{border-left:4px solid var(--acc)}
.vcard2 h3{margin:0 0 6px;font-size:16px}
.vcard2 .times{font-size:13px;color:var(--g2);font-weight:700;margin:6px 0}
.vcard2 .note{display:block;margin-top:4px}
.vstreak{font-size:13px;color:#8a5a13}
.vith{font-size:16px;font-weight:800;margin-bottom:4px}
#modal{position:fixed;inset:0;background:rgba(30,40,35,.55);display:none;z-index:50;align-items:flex-end}
#modal.on{display:flex}
#mbox{background:#fff;border-radius:18px 18px 0 0;width:100%;max-height:82vh;overflow:auto;padding:16px}
#mbox h3{margin:0 0 10px;font-size:16px}
#mbox .mrow{display:flex;gap:8px;margin-bottom:8px}
#mbox .mrow input{flex:1}
#mbox .mrow button{flex:none;font-family:inherit;font-weight:700;border-radius:10px;border:0;padding:10px 14px;background:var(--g2);color:#fff;font-size:13.5px}
#qrarea{margin-bottom:8px}
#reader video{border-radius:12px}
.sres{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.sres b{font-size:14px}.sres .note{display:block;margin-top:2px}
.mc{font-size:13px;color:var(--g2);text-align:center;padding:10px;cursor:pointer}
</head>
<body>
<header><h1>🧘 ЗенТарелка</h1><p>йога · питание · витамины · дневник прогресса</p></header>
<div class="tabs">
<div class="tab on" data-s="food"><span class="ico">🍽</span><span>Питание</span></div>
<div class="tab" data-s="yoga"><span class="ico">🧘</span><span>Йога</span></div>
<div class="tab" data-s="rec"><span class="ico">📖</span><span>Рецепты</span></div>
<div class="tab" data-s="vit"><span class="ico">💊</span><span>Витамины</span></div>
<div class="tab" data-s="diary"><span class="ico">📋</span><span>Дневник</span></div>
</div>
<main>
<div class="section on" id="sec-food">
<h2>Меню на неделю</h2>
<p class="note" style="margin-top:-6px">~1100–1400 ккал в день. Нажмите на блюдо — откроется рецепт. Галочки отмечают съеденное.</p>
<div id="menulist"></div>
</div>

<div class="section" id="sec-yoga">
<h2>Тренировки недели</h2>
<p class="note" style="margin-top:-6px">Каждый день — основная практика, спина и вечерняя растяжка. Нажмите на тренировку, чтобы открыть видео.</p>
<div id="yogalist"></div>
</div>

<div class="section" id="sec-rec">
<h2>Рецепты</h2>
<div class="filterbar" id="fbar"></div>
<div id="reclist"></div>
</div>

<div class="section" id="sec-vit">
<h2>Витамины</h2>
<div id="vitlist"></div>
</div>

<div class="section" id="sec-diary">
<h2>Дневник</h2>
<div class="startrow"><label class="note">Старт:</label><input type="date" id="startDate"><button class="btn bsec" style="width:auto;padding:9px 14px" onclick="saveStart()">Сохранить</button><button class="btn bsec" style="width:auto;padding:9px 14px" onclick="resetStart()">Сбросить</button></div>
<p class="note" style="margin:-6px 0 10px">Дату старта можно поменять в любой день — счётчик пересчитается.</p>
<div class="stat3">
<div class="card"><b id="stDays">0</b><span>дней пути</span></div>
<div class="card"><b id="stPrac">0</b><span>дней с практикой</span></div>
<div class="card"><b id="stWeek">0</b><span>дней за неделю</span></div>
</div>
<div class="card" id="calwrap">
<div class="monrow"><button onclick="calMove(-1)">‹</button><b id="monLbl"></b><button onclick="calMove(1)">›</button></div>
<div class="cal" id="cal"></div>
<p class="note">Нажмите на число — откроется дневник того дня.</p>
</div>
<div class="card">
<h3 style="margin:0 0 8px;font-size:16px" id="dTitle">Сегодня</h3>
<div id="dMeals"></div>
<div class="daykcal" id="dKcal"></div>
<h3 style="margin:12px 0 6px;font-size:16px">Практики</h3>
<div id="dPrac"></div>
</div>
<div class="backupbox">
<h3>💾 Бэкап данных</h3>
<p>Скачайте файл с вашими отметками и храните его в «Файлах» на iPhone. Чистка Safari не затронет бэкап, а восстановление вернёт всё на место.</p>
<button class="btn bprim" onclick="doBackup()">Скачать бэкап</button>
<button class="btn bsec" onclick="document.getElementById('bkfile').click()">Восстановить из файла</button>
<input type="file" id="bkfile" accept=".json" onchange="doRestore(this)">
<div class="lastbk" id="lastbk">Бэкап ещё не делался</div>
</div>
</div>
</main>
<div id="modal" onclick="if(event.target===this)closeModal()">
<div id="mbox">
<h3>Сканер продуктов</h3>
<div id="qrarea"></div>
<div class="mrow"><input type="text" id="codein" inputmode="numeric" placeholder="Цифры под штрихкодом"><button onclick="codeGo()">Найти</button></div>
<div class="mrow"><input type="text" id="qin" placeholder="Поиск по названию, напр. творог"><button onclick="nameGo()">Искать</button></div>
<div id="sres"></div>
<div class="mc" onclick="closeModal()">Закрыть</div>
</div>
</div>

function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function keyOf(dt){return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}

function cleanT(t){return t.toLowerCase().replace(/\(.*?\)/g,' ').replace(/[^a-zа-яё ]+/gi,' ').replace(/\s+/g,' ').trim();}
function matchRecipe(t){
 const a=cleanT(t);let best=null,bs=0;
 RECIPES.forEach(r=>{const b=cleanT(r.t);let s=0;
  if(b&&a&&(b.indexOf(a)>=0||a.indexOf(b)>=0))s=1;
  else{const wa=a.split(' ').filter(w=>w.length>3),wb=b.split(' ').filter(w=>w.length>3);
   let c=0;wa.forEach(w=>{if(wb.indexOf(w)>=0)c++;});
   s=Math.min(wa.length,wb.length)?c/Math.min(wa.length,wb.length):0;}
  if(s>bs){bs=s;best=r;}});
 return bs>=0.5?best:null;
}

}

   h+='<div class="mealrow"><div class="info" onclick="toggleExp(\'ex'+di+'_'+ii+'\')"><b>'+it[1]+' <span class="note">▾</span></b><span class="tag">'+it[0]+' · '+it[2]+' ккал · нажмите, чтобы открыть рецепт</span>'+expHtml('ex'+di+'_'+ii,it[1])+'</div><div class="chkbx '+(on?'on':'')+'" onclick="toggleFood('+di+',\''+k.replace(/'/g,'')+'\')">✓</div></div>';
  });
  custom.forEach((c,ci)=>{
   h+='<div class="mealrow"><div class="info"><b>'+c.n+' <span class="note">· своё</span></b><span class="tag">'+c.k+' ккал</span></div><div class="chkbx '+(c.done?'on':'')+'" onclick="toggleCustom('+di+','+ci+')">✓</div><div class="del" onclick="delCustom('+di+','+ci+')">✕</div></div>';
  });
  h+='<div class="addrow"><button onclick="addCustom('+di+')">＋ Добавить своё</button></div></div>';
 });
 document.getElementById('menulist').innerHTML=h;
}
function toggleExp(id){const e=document.getElementById(id);if(e)e.classList.toggle('on');}
function toggleFood(di,k){S.food[k]=!S.food[k];if(!S.food[k])delete S.food[k];sv();renderMenu();renderDiary();}
function addCustom(di){
 const n=prompt('Что добавляем? Название блюда или продукта:');if(!n)return;
 const k=parseInt(prompt('Калории (можно примерно):','150'),10)||0;
 S.custom[di]=S.custom[di]||[];S.custom[di].push({n:n,k:k,done:false});sv();renderMenu();renderDiary();
}
function toggleCustom(di,ci){const c=S.custom[di][ci];c.done=!c.done;sv();renderMenu();renderDiary();}
function delCustom(di,ci){
 if(confirm('Удалить «'+S.custom[di][ci].n+'» из этого дня?')){S.custom[di].splice(ci,1);sv();renderMenu();renderDiary();}
}
function swapMenu(){
 if(confirm('Заменить рацион на альтернативный? Отметки съеденного по названиям блюд сохранятся, добавленная вами еда тоже.')){
  S.variant=S.variant?0:1;sv();renderMenu();renderDiary();
 }
}

/* --- сканер --- */
let h5q=null,searchRes=[];
function openModal(){document.getElementById('modal').classList.add('on');}
function closeModal(){scanStop();document.getElementById('modal').classList.remove('on');}
function scanCam(){
 openModal();document.getElementById('sres').innerHTML='';
 const area=document.getElementById('qrarea');
 if(!window.Html5Qrcode){area.innerHTML='<p class="note">Сканер не загрузился — проверьте интернет или введите цифры кода вручную.</p>';return;}
 area.innerHTML='<div id="reader" style="width:100%"></div>';
 h5q=new Html5Qrcode('reader');
 h5q.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:110}},
  txt=>{scanStop();lookupCode(txt);},
 ).catch(()=>{area.innerHTML='<p class="note">Камера недоступна. Разрешите доступ или введите цифры кода вручную.</p>';});
}
function scanStop(){if(h5q){h5q.stop().then(()=>h5q.clear()).catch(()=>{});h5q=null;}}
function scanManual(){openModal();document.getElementById('qrarea').innerHTML='';document.getElementById('sres').innerHTML='';}
function codeGo(){
 const c=document.getElementById('codein').value.trim();if(!c)return;
 lookupCode(c);
}
function kcalOf(nu){
 if(!nu)return null;
 if(nu['energy-kcal_100g']!=null)return Math.round(nu['energy-kcal_100g']);
 if(nu['energy_100g']!=null)return Math.round(nu['energy_100g']/4.184);
 return null;
}
function lookupCode(code){
 fetch('https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'.json?fields=product_name,brands,nutriments')
 .then(r=>r.json()).then(d=>{
  if(d&&d.product&&d.product.product_name){
   showPick([{n:d.product.product_name+(d.product.brands?' ('+d.product.brands+')':''),k:kcalOf(d.product.nutriments)}]);
  }else{alert('Продукт не найден в открытой базе. Попробуйте поиск по названию.');}
 }).catch(()=>alert('Нет связи с базой продуктов. Проверьте интернет.'));
}
function nameGo(){
 const q=document.getElementById('qin').value.trim();if(!q)return;
 fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='+encodeURIComponent(q)+'&search_simple=1&action=process&json=1&page_size=8&fields=product_name,brands,nutriments')
 .then(r=>r.json()).then(d=>{
  const list=(d.products||[]).filter(p=>p.product_name).map(p=>({n:p.product_name+(p.brands?' ('+p.brands+')':''),k:kcalOf(p.nutriments)}));
  if(!list.length){document.getElementById('sres').innerHTML='<p class="note">Ничего не нашлось. Попробуйте другое название или добавьте блюдо вручную через «＋ Добавить своё».</p>';return;}
  showPick(list);
 }).catch(()=>alert('Нет связи с базой. Проверьте интернет.'));
}
function showPick(list){
 searchRes=list;
 document.getElementById('sres').innerHTML='<p class="note">Нашлось — выберите продукт:</p>'+list.map((p,i)=>'<div class="sres" onclick="pickProd('+i+')"><b>'+p.n+'</b><span class="note">'+(p.k!=null?p.k+' ккал на 100 г':'калории неизвестны — впишем 0, можно поправить')+'</span></div>').join('');
}
function pickProd(i){
 const p=searchRes[i];
 const g=parseInt(prompt(p.k!=null?('Сколько грамм съели? (100 г = '+p.k+' ккал)'):'Сколько грамм съели? (в базе нет калорий — учтём как 0)','100'),10)||100;
 const kc=p.k!=null?Math.round(p.k*g/100):0;
 const di=(new Date().getDay()+6)%7;
 S.custom[di]=S.custom[di]||[];S.custom[di].push({n:p.n+' · '+g+' г',k:kc,done:true});
 sv();closeModal();renderMenu();renderDiary();
}

/* --- йога --- */
function vcardHtml(p){
 return '<div class="vcard"><div class="vhead" style="background:linear-gradient(135deg,'+p.c1+','+p.c2+')" onclick="openV(\''+p.id+'\')"><div class="t">'+p.t+'</div><div class="s">'+p.sub+'</div><div class="pl">▶ Смотреть</div></div><div class="vframe" id="vf-'+p.id+'"><iframe src="https://rutube.ru/play/embed/'+p.v+'" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe></div></div>';
}
function renderYoga(){
 const td=(new Date().getDay()+6)%7;let h='';
 DOWF.forEach((dn,dow)=>{
  const mainId=dow===6?'power_sun':(dow%2===0?'power_mon':'power_mid');
  const ids=[mainId,'back','stretch'];
  h+='<h3 class="dy">'+dn+(dow===td?' <span class="tdy">сегодня</span>':'')+'</h3><div class="vgrid">';
  ids.forEach(id=>{const p=PRACTICES.find(x=>x.id===id);h+=vcardHtml(p);});
  h+='</div>';
 });
 const lb=PRACTICES.find(x=>x.id==='lumbar');
 h+='<h3 class="dy">Бонус по желанию</h3><div class="vgrid">'+vcardHtml(lb)+'</div>';

}
function openV(id){document.getElementById('vf-'+id).classList.toggle('on');}

/* --- рецепты --- */
let curF='Все';
function renderFbar(){
 const cats=['Все','Завтраки','Обеды','Ужины','Перекусы'];
 document.getElementById('fbar').innerHTML=cats.map(c=>'<div class="fbtn '+(c===curF?'on':'')+'" onclick="setF(\''+c+'\')">'+c+'</div>').join('');
}
function setF(c){curF=c;renderFbar();renderRec();}
function renderRec(){
 let h='',gi=0;
 RECIPES.filter(r=>curF==='Все'||r.c===curF).forEach(r=>{
  const em=EMOJI[r.t]||'🥗';const g=GRADS[gi%GRADS.length];gi++;
  h+='<div class="card rec"><div class="rhead" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><span class="re">'+em+'</span></div><div class="rbody"><b onclick="toggleExp(\'rex'+gi+'\')" style="cursor:pointer">'+r.t+'</b> <span class="kcal">· '+r.kcal+' ккал</span><span class="note" style="display:block;margin-top:2px">Нажмите на название — откроется приготовление</span>'+expHtml('rex'+gi,r.t)+'</div></div>';
 });
 document.getElementById('reclist').innerHTML=h;
}

/* --- витамины --- */
function vtOf(v){return S.vitTimes[v.id]||v.times;}
function renderVits(){
 const tk=todayKey();let pend=0,h='';
 h+='<div class="card"><div class="vith">💊 Сегодня</div>';
 VITS.forEach(v=>{vtOf(v).forEach((tm,ti)=>{
  const done=!!(S.vit[tk]&&S.vit[tk][v.id+'_'+ti]);
  if(!done)pend++;
  h+='<div class="mealrow"><div class="info"><b>'+v.name+' принять</b><span class="tag">'+tm+' · '+v.info.split('.')[0]+'.</span></div><div class="chkbx '+(done?'on':'')+'" onclick="toggleVit(\''+tk+'\',\''+v.id+'\','+ti+')">'+(done?'✓':'')+'</div></div>';
 });});
 h+='</div>';
 h+=pend?('<div class="warn">Осталось принять сегодня: '+pend+'</div>'):('<div class="okbox">Всё выпито! Так держать 💪</div>');
 h+='<button class="btn bprim" style="margin:12px 0" onclick="askNotif()">🔔 Включить напоминания</button>';
 VITS.forEach(v=>{
  const tms=vtOf(v).join(', ');
  h+='<div class="card vcard2"><h3>'+v.name+'</h3><div class="times">⏰ '+tms+' <span class="note" style="cursor:pointer" onclick="editVit(\''+v.id+'\')">✎</span></div><span class="note">'+v.info+'</span><div class="vstreak" style="margin-top:8px">🔥 Серия: '+streakOf(v)+' дн.</div></div>';
 });
 document.getElementById('vitlist').innerHTML=h;
}
function toggleVit(k,id,ti){S.vit[k]=S.vit[k]||{};const key=id+'_'+ti;S.vit[k][key]=!S.vit[k][key];if(!S.vit[k][key])delete S.vit[k][key];sv();renderVits();}
function streakOf(v){
 let s=0;const n=vtOf(v).length;let d=new Date();
 let allToday=true;const tk=keyOf(d);
 for(let t=0;t<n;t++){if(!(S.vit[tk]&&S.vit[tk][v.id+'_'+t]))allToday=false;}
 if(!allToday)d.setDate(d.getDate()-1);
 for(let i=0;i<365;i++){let all=true;const k=keyOf(d);
  for(let t=0;t<n;t++){if(!(S.vit[k]&&S.vit[k][v.id+'_'+t])){all=false;break;}}
  if(all){s++;d.setDate(d.getDate()-1);}else break;}
 return s;
}
function editVit(id){
 const v=VITS.find(x=>x.id===id);const cur=vtOf(v).join(', ');
 const t=prompt('Время приёма через запятую (например 09:00, 13:30):',cur);
 if(!t)return;
 const arr=t.split(',').map(s=>s.trim()).filter(s=>/^\d{1,2}:\d{2}$/.test(s)).map(s=>{const[h,m]=s.split(':');return String(h).padStart(2,'0')+':'+m;});
 if(!arr.length){alert('Не похоже на время. Пример: 09:00, 13:30');return;}
 S.vitTimes[id]=arr;sv();renderVits();
}
const notifQ={};
function askNotif(){
 if(!('Notification' in window)){alert('Уведомления не поддерживаются этим браузером. Поставьте напоминания в iPhone: «Здоровье» → «Напоминания».');return;}
 Notification.requestPermission().then(p=>{
  if(p==='granted')alert('Готово! Пока «ЗенТарелка» открыта, напомню вовремя. Для напоминаний при закрытом приложении добавьте приёмы в системные «Напоминания».');
  else alert('Уведомления запрещены. Разрешите их: Настройки → Safari → Уведомления.');
 });
}
function addMin(tm,m){const p=tm.split(':');const t=(+p[0])*60+(+p[1])+m;const H=Math.floor(t/60),M=t%60;return String(H).padStart(2,'0')+':'+String(M).padStart(2,'0');}
function checkNotif(){
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const now=new Date();const hhmm=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
 const tk=todayKey();
 VITS.forEach(v=>{vtOf(v).forEach((tm,ti)=>{
  if(S.vit[tk]&&S.vit[tk][v.id+'_'+ti])return;
  const q=tk+'|'+v.id+'|'+ti;
  if(tm<=hhmm&&hhmm<addMin(tm,10)&&!notifQ[q]){
   notifQ[q]=1;
   try{new Notification('ЗенТарелка 💊',{body:v.name+' — время принять ('+tm+')'});}catch(e){}
  }
 });});
}
setInterval(checkNotif,30000);checkNotif();

/* --- дневник --- */
function pracForDow(dow){return SCHED[dow]||[]}
function calMove(m){S.calOff=(S.calOff||0)+m;S.calOff=Math.max(-24,Math.min(24,S.calOff));sv();renderDiary();}
function pickDay(k){S.viewDate=k;sv();renderDiary();}
function saveStart(){
 S.start=document.getElementById('startDate').value||null;sv();renderDiary();
}
function resetStart(){
 if(confirm('Убрать дату старта? Счётчик дней обнулится, отметки останутся.')){S.start=null;sv();renderDiary();}
}
function renderDiary(){
 document.getElementById('startDate').value=S.start||'';
 let days=0,pracAll=0,pracWeek=0;
 if(S.start){
  const a=new Date(S.start+'T00:00:00');const n=new Date();n.setHours(0,0,0,0);
  days=Math.max(0,Math.round((n-a)/864e5));
 }
 for(const pk in S.prac){if(Object.values(S.prac[pk]).some(x=>x))pracAll++;}
 for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const pk=keyOf(d);const v=S.prac[pk];if(v&&Object.values(v).some(x=>x))pracWeek++;}
 document.getElementById('stDays').textContent=days;
 document.getElementById('stPrac').textContent=pracAll;
 document.getElementById('stWeek').textContent=pracWeek;
 const base=new Date();base.setDate(1);base.setMonth(base.getMonth()+S.calOff);
 const y=base.getFullYear(),m=base.getMonth();
 document.getElementById('monLbl').textContent=MON[m]+' '+y;
 const first=new Date(y,m,1);const startCol=(first.getDay()+6)%7;
 const dim=new Date(y,m+1,0).getDate();
 let h='';
 for(let i=0;i<startCol;i++)h+='<div></div>';
 for(let d=1;d<=dim;d++){
  const dt=new Date(y,m,d),k=keyOf(dt);
  const v=S.prac[k];let dot='';
  if(v){const done=Object.values(v).filter(x=>x).length;dot=done>=3?'done':(done>0?'part':'');}
  h+='<div class="cel '+(k===todayKey()?'today':'')+' '+(k===S.viewDate?'sel':'')+'" onclick="pickDay(\''+k+'\')"><span>'+d+'</span><span class="dot '+dot+'"></span></div>';
 }
 document.getElementById('cal').innerHTML=h;
 // карточка выбранного дня
 const vd=S.viewDate||todayKey();
 const dsel=new Date(vd+'T00:00:00');
 const dow=(dsel.getDay()+6)%7;
 const isToday=vd===todayKey();
 document.getElementById('dTitle').textContent=(isToday?'Сегодня':dsel.getDate()+' '+MONG[dsel.getMonth()])+' · '+DOW[dow];
 const M=menu();const mi=dow;
 let mh='',mt=0;
 const day=M[mi];
 if(day){
  day.items.forEach((it,ii)=>{
   const k=day.d+'|'+it[1],on=!!S.food[k];if(on)mt+=it[2];
   mh+='<div class="mealrow"><div class="info" onclick="toggleExp(\'dx'+ii+'\')"><b>'+it[1]+'</b><span class="tag">'+it[0]+' · '+it[2]+' ккал</span>'+expHtml('dx'+ii,it[1])+'</div><div class="chkbx '+(on?'on':'')+'" onclick="toggleFood('+mi+',\''+k.replace(/'/g,'')+'\')">'+(on?'✓':'')+'</div></div>';
  });
 }
 (S.custom[dow]||[]).forEach((c,ci)=>{if(c.done)mt+=c.k;
  mh+='<div class="mealrow"><div class="info"><b>'+c.n+' <span class="note">· своё</span></b><span class="tag">'+c.k+' ккал</span></div><div class="chkbx '+(c.done?'on':'')+'" onclick="toggleCustom('+dow+','+ci+')">'+(c.done?'✓':'')+'</div></div>';});
 document.getElementById('dMeals').innerHTML=mh||'<p class="note">Записей за этот день нет.</p>';
 document.getElementById('dKcal').textContent='Отмечено: '+mt+' ккал из плана';
 const plist=['Основная практика','Спина','Растяжка'];
 const sched=pracForDow(dow);
 let ph='';
 plist.forEach((name,pi)=>{
  const on=!!(S.prac[vd]&&S.prac[vd][pi]);
  ph+='<div class="mealrow"><div class="info"><b>'+name+'</b><span class="tag">'+(sched[pi]||'')+'</span></div><div class="chkbx '+(on?'on':'')+'" onclick="togglePrac(\''+vd+'\','+pi+')">'+(on?'✓':'')+'</div></div>';
 });
 document.getElementById('dPrac').innerHTML=ph;
}
function togglePrac(k,pi){S.prac[k]=S.prac[k]||{};S.prac[k][pi]=!S.prac[k][pi];if(!S.prac[k][pi])delete S.prac[k][pi];sv();renderDiary();}

/* --- бэкап --- */
function doBackup(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='zentarelka-backup-'+todayKey()+'.json';a.click();
 S.lastbk=todayKey();sv();document.getElementById('lastbk').textContent='Последний бэкап: '+todayKey();
}
function doRestore(inp){
 const f=inp.files[0];if(!f)return;
 if(!confirm('Восстановить данные из файла? Текущие отметки будут заменены.'))return;
 const r=new FileReader();
 r.onload=e=>{try{
  const d=JSON.parse(e.target.result);
  if(!d||typeof d!=='object'||!('food' in d))throw 0;
  S=d;S.prac=S.prac||{};S.food=S.food||{};S.vit=S.vit||{};S.custom=S.custom||{};S.vitTimes=S.vitTimes||{};S.variant=S.variant||0;S.viewDate=S.viewDate||todayKey();S.calOff=S.calOff||0;
  sv();renderAll();alert('Данные восстановлены!');
 }catch(err){alert('Не удалось прочитать файл. Убедитесь, что это файл, скачанный из этого приложения.');}};
 r.readAsText(f);
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
 document.querySelectorAll('.section').forEach(x=>x.classList.remove('on'));
 t.classList.add('on');document.getElementById('sec-'+t.dataset.s).classList.add('on');
 window.scrollTo(0,0);
}));
function renderAll(){renderMenu();renderYoga();renderFbar();renderRec();renderVits();renderDiary();
 if(S.lastbk)document.getElementById('lastbk').textContent='Последний бэкап: '+S.lastbk;}
renderAll();
</script>
