<style>
:root{--bg:#f4f1ea;--card:#fff;--ink:#2b2b26;--sub:#8a8a80;--green:#3d5c47;--green2:#2e4a3a;--line:#d8d2c4;--accent:#5c7a64}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Azoft Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{background:linear-gradient(135deg,#2e4a3a,#4a6a52);color:#fff;padding:22px 18px 16px}
header h1{font-size:26px;font-weight:700}
header p{opacity:.85;font-size:14px;margin-top:4px}
nav{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
nav button{flex:1;padding:12px 2px 10px;border:0;background:none;font-size:12px;color:var(--sub);font-family:inherit;position:relative}
nav button.on{color:var(--ink);font-weight:700}
nav button.on:after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:3px;background:var(--green);border-radius:3px}
nav .ic{font-size:20px;display:block;text-align:center}
main{padding:16px}
section.page{display:none}
section.page.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:18px 0 8px}
.hint{color:var(--sub);font-size:14px;line-height:1.5;margin-bottom:14px}
.card{background:var(--card);border:1px solid #e3ddcf;border-radius:16px;padding:16px;margin-bottom:14px}
.dayhead{font-size:18px;font-weight:700;margin-bottom:4px}
.dayhead span{color:var(--sub);font-weight:400;font-size:14px}
.meal{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.meal:last-child{border-bottom:0}
.meal .txt{flex:1}
.meal .name{font-weight:700;font-size:16px}
.meal .meta{color:var(--sub);font-size:13px;margin-top:2px}
.chk{width:26px;height:26px;border:2px solid var(--green);border-radius:8px;flex:none;margin-top:2px;position:relative}
.chk.on{background:var(--green)}
.chk.on:after{content:"✓";color:#fff;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px}
.btn{display:inline-block;background:var(--green2);color:#fff;border:0;border-radius:24px;padding:12px 20px;font-size:15px;font-family:inherit;margin:4px 6px 4px 0}
.btn.sec{background:#fff;color:var(--green2);border:1.5px solid var(--green)}
.btn.wide{display:block;width:100%;text-align:center;margin:8px 0}
.recipe{background:#f6f4ec;border-radius:12px;padding:12px;margin-top:8px;font-size:14px;line-height:1.55;display:none}
.recipe.open{display:block}
.recipe b{display:block;margin:8px 0 4px}
.rec-list .card{break-inside:avoid}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px}
.chip{border:1.5px solid var(--green);border-radius:20px;padding:7px 14px;font-size:14px;background:#fff;white-space:nowrap;font-family:inherit}
.chip.on{background:var(--green);color:#fff}
.ygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.yday{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 2px;text-align:center}
.yday .dn{font-size:11px;color:var(--sub)}
.yday .em{font-size:22px;margin-top:4px}
.yday.off{opacity:.35}
.ybar{display:flex;align-items:flex-end;gap:6px;height:80px;margin:12px 0 4px}
.ybar div{flex:1;background:#cfd8cf;border-radius:6px 6px 0 0;position:relative}
.ybar div.f{background:var(--green)}
.weekrow{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.weekrow .arr{font-size:22px;background:none;border:0;color:var(--green);padding:6px 14px}
.sumline{background:#eef1ea;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.vit{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px dashed var(--line)}
.vit .nm{font-weight:700;font-size:16px}
.vit .mt{color:var(--sub);font-size:13px;margin-top:2px}
.streak{font-size:13px;color:#b46a2a;margin-top:2px}
input.tin{border:1.5px solid var(--line);border-radius:10px;padding:8px;font-size:15px;font-family:inherit;background:#fff}
.note{color:var(--sub);font-size:13px;line-height:1.5;margin-top:10px}
.stat{display:flex;gap:10px;margin:10px 0}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat .v{font-size:20px;font-weight:700;color:var(--green2)}
.stat .l{font-size:12px;color:var(--sub)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--green2);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>

<header><h1>🧘 ЗенТарелка</h1><p>йога · питание · витамины · дневник прогресса</p></header>

  <section class="page" id="p-yoga"></section>
  <section class="page" id="p-rec"></section>
  <section class="page" id="p-vit"></section>
  <section class="page" id="p-diary"></section>
</main>

  var r=MENU[st.ration], h='<button class="btn sec wide" id="swapR">🔄 Заменить рацион на неделю</button>';
  h+="<h2>Меню на неделю</h2><p class='hint'>~1100–1400 ккал в день. Нажмите на блюдо — раскроется рецепт. Ставьте галочки по мере приёмов пищи — дневник посчитает калории сам.</p>";
  for(var di=0;di<r.length;di++){
    var tot=0; for(var mi=0;mi<r[di].meals.length;mi++) tot+=r[di].meals[mi].k;
    h+='<div class="card"><div class="dayhead">'+r[di].d+' <span>· '+tot+' ккал</span></div>';
    for(var mi=0;mi<r[di].meals.length;mi++){
      var mm=r[di].meals[mi], key=fkey(st.ration,di,mi), on=st.food[key]?1:0;
      h+='<div class="meal"><div class="chk'+(on?" on":"")+'" data-k="'+key+'" data-d="'+di+'" data-m="'+mi+'"></div><div class="txt"><div class="name">'+mm.n+'</div><div class="meta">'+MEALT[mi]+' · '+mm.k+' ккал'+(REC[mm.n]?' · рецепт ▾':'')+'</div>';
      if(REC[mm.n]){h+=recHTML(mm.n, "f"+di+"_"+mi);}
      h+='</div></div>';
    }
    h+='</div>';
  }
  $("p-food").innerHTML=h;
  bindChecks($("p-food"));
  $("swapR").addEventListener("click",function(){st.ration=st.ration?0:1;SV(st);renderAll();toast("Рацион заменён");});
  bindRecToggles($("p-food"));
}
function recHTML(name,id){
  var r=REC[name], h='<div class="recipe" id="'+id+'"><b>Ингредиенты</b>'+r.i.join(", ")+'.<b>Приготовление</b>';
  for(var i=0;i<r.s.length;i++) h+=(i+1)+". "+r.s[i]+"<br>";
  h+='<b>КБЖУ</b>'+r.k+' ккал / 100 г · '+r.t+' · '+r.p+' порц.</div>';
  return h;
}
function bindRecToggles(root){
  var names=root.getElementsByClassName("name");
  for(var i=0;i<names.length;i++){
    (function(el){
      el.addEventListener("click",function(){
        var p=el.parentNode.getElementsByClassName("recipe")[0];
        if(p)p.classList.toggle("open");
      });
    })(names[i]);
  }
}
function bindChecks(root){
  var cs=root.getElementsByClassName("chk");
  for(var i=0;i<cs.length;i++){
    (function(el){
      el.addEventListener("click",function(){
        var k=el.getAttribute("data-k");
        if(st.food[k]){delete st.food[k];el.classList.remove("on");}
        else{st.food[k]=1;el.classList.add("on");}
        SV(st); if(curTab===4)renderDiary();
      });
    })(cs[i]);
  }
}
function renderYoga(){
  var mon=new Date(today()); mon.setDate(mon.getDate()-mon.getDay()+1); mon.setDate(mon.getDate()+yWeek*7);
  var cells="", marks=0, done=0;
  for(var i=0;i<7;i++){
    var d=new Date(mon); d.setDate(d.getDate()+i);
    var k=dkey(d), on=st.yoga[k]?1:0;
    if(on)done++;
    var fut=d>today();
    var dn=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"][i];
    cells+='<div class="yday'+(fut?" off":"")+'" data-k="'+k+'" data-dn="'+dn+'"><div class="dn">'+dn+' '+(d.getDate())+'</div><div class="em">'+(on?"🧘":"○")+'</div></div>';
  }
  var bars="";
  for(var j=0;j<7;j++){
    var d2=new Date(mon); d2.setDate(d2.getDate()+j);
    var on2=st.yoga[dkey(d2)]?1:0;
    bars+='<div class="'+(on2?"f":"")+'" style="height:'+(on2?100:12)+'%"></div>';
  }
  var h="<h2>Тренировки недели</h2><p class='hint'>Основа — силовая практика каждый день, растяжка вечером — заминка. Нажмите на день, чтобы отметить занятие.</p>";
  h+='<div class="card"><div class="ygrid">'+cells+'</div><div class="ybar">'+bars+'</div>';
  h+='<div class="weekrow"><button class="arr" id="ywL">‹</button><b>'+mon.getDate()+' '+MONTHS[mon.getMonth()]+' — '+done+' из 7 дней</b><button class="arr" id="ywR">›</button></div></div>';
  for(var p=0;p<PRACS.length;p++){
    h+='<div class="card"><b>'+PRACS[p].n+' · '+PRACS[p].min+' мин</b><p class="hint" style="margin:6px 0">'+PRACS[p].d+'</p><button class="btn sec" data-p="'+p+'">▶ Начать '+PRACS[p].min+' мин</button></div>';
  }
  $("p-yoga").innerHTML=h;
  var yd=$("p-yoga").getElementsByClassName("yday");
  for(var y=0;y<yd.length;y++){
    (function(el){
      el.addEventListener("click",function(){
        var k=el.getAttribute("data-k");
        var d=new Date(k); if(d>today())return;
        if(st.yoga[k]){delete st.yoga[k];}else{st.yoga[k]=1;}
        SV(st);renderAll();
      });
    })(yd[y]);
  }
  $("ywL").addEventListener("click",function(){yWeek--;renderYoga();});
  $("ywR").addEventListener("click",function(){yWeek++;renderYoga();});
  var pb=$("p-yoga").getElementsByTagName("button");
  for(var b=0;b<pb.length;b++){
    if(pb[b].getAttribute("data-p")!=null){
      (function(btn, mins){
        btn.addEventListener("click",function(){
          var left=mins*60; btn.disabled=true;
          var iv=setInterval(function(){
            left--; var m=Math.floor(left/60), s=left%60;
            btn.textContent="⏳ "+m+":"+("0"+s).slice(-2);
            if(left<=0){clearInterval(iv);btn.textContent="Готово ✓";btn.disabled=false;
              var k=dkey(today()); st.yoga[k]=1; SV(st); renderAll(); toast("Практика засчитана 🧘");}
          },1000);
        });
      })(pb[b], PRACS[pb[b].getAttribute("data-p")].min);
    }
  }
}
function renderRec(){
  var cats=["Все","Завтраки","Обеды","Ужины","Перекусы"];
  var h="<h2>Рецепты</h2><p class='hint'>Нажмите на название блюда — раскроются ингредиенты и шаги приготовления.</p><div class='chips'>";
  for(var c=0;c<cats.length;c++)h+='<button class="chip'+(recFilter===cats[c]?" on":"")+'">'+cats[c]+'</button>';
  h+='</div>';
  var cat=function(n){
    if(n.indexOf("салат")>-1)return "Обеды";
    if(n.indexOf("тост")>-1||n.indexOf("панкейк")>-1||n.indexOf("хлеб")>-1||n.indexOf("блинчик")>-1||n.indexOf("овсянк")>-1||n.indexOf("сырник")>-1||n.indexOf("творог")>-1||n.indexOf("Омлет")>-1)return "Завтраки";
    if(n.indexOf("йогурт")>-1||n.indexOf("Яблоко")>-1||n.indexOf("Банан")>-1)return "Перекусы";
    return "Ужины";
  };
  var keys=[]; for(var k in REC)keys.push(k);
  for(var i=0;i<keys.length;i++){
    var n=keys[i];
    if(recFilter!=="Все"&&cat(n)!==recFilter)continue;
    var r=REC[n];
    h+='<div class="card"><div class="name" style="font-weight:700">'+n+'</div><div class="meta" style="color:var(--sub);font-size:13px">'+r.k+' ккал/100 г · '+r.t+' · '+r.p+' порц.</div>'+recHTML(n,"r"+i)+'</div>';
  }
  $("p-rec").innerHTML=h; bindRecToggles($("p-rec"));
  var ch=$("p-rec").getElementsByClassName("chip");
  for(var j=0;j<ch.length;j++){(function(el){el.addEventListener("click",function(){recFilter=el.textContent;renderRec();});})(ch[j]);}
}
function vitTimes(){return VIT0.map(function(v,i){return {n:v.n,t:st.vtimes[i]||v.t};});}
function vitKey(i,d){return "v"+i+"_"+dkey(d);}
function streakOf(i){
  var s=0, d=today();
  while(st.vit[vitKey(i,d)]){s++;d.setDate(d.getDate()-1);}
  return s;
}
function renderVit(){
  var t=today(), tk=dkey(t);
  var list=vitTimes();
  var left="";
  for(var i=0;i<list.length;i++){
    if(!st.vit[vitKey(i,t)])left+=list[i].n+" ("+list[i].t+"), ";
  }
  left=left.replace(/, $/,"");
  var h="<h2>Витамины</h2><p class='hint'>Отмечайте каждый приём — серия 🔥 покажет, сколько дней подряд без пропусков.</p>";
  if(left)h+='<div class="card" style="background:#eef1ea">ОСТАЛОСЬ ПРИНЯТЬ: '+left+'</div>';
  h+='<div class="card"><div class="dayhead">Сегодня</div>';
  for(var j=0;j<list.length;j++){
    var on=st.vit[vitKey(j,t)]?1:0, sr=streakOf(j);
    h+='<div class="vit"><div class="chk'+(on?" on":"")+'" data-v="'+j+'"></div><div class="txt"><div class="nm">'+list[j].n+'</div><div class="mt">ПРИНЯТЬ · '+list[j].t+'</div>'+(sr>0?'<div class="streak">🔥 серия: '+sr+'</div>':'')+'</div></div>';
  }
  h+='</div>';
  h+='<button class="btn wide" id="notif">🔔 Включить напоминания</button>';
  h+='<button class="btn sec wide" id="ics">📅 Напоминания в Календарь iPhone</button>';
  h+='<p class="note">🔔 работает, пока приложение открыто. 📅 добавляет приёмы в системный Календарь — iOS сама пришлёт уведомление в нужное время, даже когда приложение закрыто.</p>';
  h+='<h2>Инструкция к добавкам</h2>';
  for(var v=0;v<VIT0.length;v++){
    var tm=st.vtimes[v]||VIT0[v].t;
    h+='<div class="card"><b>'+VIT0[v].n+'</b><div class="meta" style="color:var(--sub);font-size:13px;margin:4px 0">ВРЕМЯ: <input class="tin" type="time" value="'+tm+'" data-ti="'+v+'"></div><p style="font-size:14px;line-height:1.55">'+(st.vinstr[v]||VIT0[v].i)+'</p></div>';
  }
  $("p-vit").innerHTML=h;
  var vc=$("p-vit").getElementsByClassName("chk");
  for(var c=0;c<vc.length;c++){
    (function(el){
      el.addEventListener("click",function(){
        var idx=el.getAttribute("data-v");
        if(st.vit[vitKey(idx,t)]){delete st.vit[vitKey(idx,t)];el.classList.remove("on");}
        else{st.vit[vitKey(idx,t)]=1;el.classList.add("on");}
        SV(st);renderAll();
      });
    })(vc[c]);
  }
  var tis=$("p-vit").getElementsByClassName("tin");
  for(var ti=0;ti<tis.length;ti++){
    (function(inp){
      inp.addEventListener("change",function(){st.vtimes[inp.getAttribute("data-ti")]=inp.value;SV(st);renderVit();});
    })(tis[ti]);
  }
  $("notif").addEventListener("click",function(){
    if(!("Notification" in window)){toast("Уведомления не поддерживаются");return;}
    Notification.requestPermission().then(function(p){
      if(p==="granted"){toast("Напоминания включены 🔔");}else{toast("Разрешение не выдано");}
    });
  });
  $("ics").addEventListener("click",exportICS);
}
function exportICS(){
  var list=vitTimes(), out="";
  out+="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//ZenTarelka//RU\r\n";
  var base=today();
  for(var rep=0;rep<90;rep++){
    var d=new Date(base); d.setDate(d.getDate()+rep);
    var ds=d.getFullYear()+("0"+(d.getMonth()+1)).slice(-2)+("0"+d.getDate()).slice(-2);
    for(var i=0;i<list.length;i++){
      var tt=list[i].t.replace(":","")+"00";
      out+="BEGIN:VEVENT\r\nUID:zt"+rep+"-"+i+"@zentarelka\r\nDTSTART:"+ds+"T"+tt+"\r\nDTEND:"+ds+"T"+tt+"\r\nSUMMARY:"+list[i].n+" — принять\r\nDESCRIPTION:"+ (st.vinstr[i]||"")+"\r\nBEGIN:VALARM\r\nTRIGGER:-PT0M\r\nACTION:DISPLAY\r\nDESCRIPTION:"+list[i].n+"\r\nEND:VALARM\r\nEND:VEVENT\r\n";
    }
  }
  out+="END:VCALENDAR";
  var blob=new Blob([out],{type:"text/calendar"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="vitamins.ics";
  document.body.appendChild(a); a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},15000);
  toast("Файл vitamins.ics скачан — откройте его и нажмите «Добавить все» 📅");
}
function renderDiary(){
  var mon=new Date(today()); mon.setDate(mon.getDate()-mon.getDay()+1); mon.setDate(mon.getDate()+yWeek*7);
  var r=MENU[st.ration], sumF=0, sumY=0;
  var h="<h2>Дневник прогресса</h2>";
  h+='<div class="sumline" id="sumline"></div>';
  for(var i=0;i<7;i++){
    var d=new Date(mon); d.setDate(d.getDate()+i);
    var k=dkey(d), tot=0, cnt=0;
    for(var di=0;di<r.length;di++){
      for(var mi=0;mi<r[di].meals.length;mi++){
        if(st.food[fkey(st.ration,di,mi)]){tot+=r[di].meals[mi].k;cnt++;}
      }
    }
    var y=st.yoga[k]?1:0; if(y)sumY++;
    var dd=today();
    var dt=d.getDate()+" "+MONTHS[d.getMonth()];
    var cls=d.getTime()===dd.getTime()?" on":"";
    h+='<div class="card'+cls+'"><div class="dayhead">'+dt+' <span>'+(y?"🧘 practiced":"")+'</span></div><div class="hint">🍽 '+tot+' ккал из ~1200 · приёмов: '+cnt+'/4 · 💊 витаминов принято: '+countVit(k)+'/5</div></div>';
  }
  h+='<div class="card"><b>💾 Бэкап данных</b><p class="hint">Скачайте файл с вашими отметками и храните его в «Файлах» на iPhone. Чистка Safari не затронет бэкап, а восстановление вернёт всё на место.</p><button class="btn wide" id="bkDl">Скачать бэкап</button><button class="btn sec wide" id="bkUp">Восстановить из файла</button><input type="file" id="bkIn" style="display:none"></div>';
  $("p-diary").innerHTML=h;
  $("sumline").innerHTML="🍽 Питание: отмечено приёмов на этой неделе: "+countWeekFood(mon)+" · 🧘 Йога: "+sumY+"/7";
  bindBackup();
}
function countVit(k){
  var c=0; for(var i=0;i<VIT0.length;i++)if(st.vit["v"+i+"_"+k])c++; return c;
}
function countWeekFood(mon){
  var r=MENU[st.ration], n=0;
  for(var i=0;i<7;i++){
    var d=new Date(mon); d.setDate(d.getDate()+i);
    for(var di=0;di<r.length;di++)for(var mi=0;mi<r[di].meals.length;mi++)if(st.food[fkey(st.ration,di,mi)])n++;
  }
  return n;
}
function renderAll(){
  renderFood();renderYoga();renderRec();renderVit();renderDiary();
  var ps=document.getElementsByClassName("page");
  for(var i=0;i<ps.length;i++)ps[i].className="page"+(i===curTab?" on":"");
}
renderNav();renderAll();
// свайп между вкладками
var tx0=null,ty0=null;
document.addEventListener("touchstart",function(e){tx0=e.touches[0].clientX;ty0=e.touches[0].clientY;},{passive:true});
document.addEventListener("touchend",function(e){
  if(tx0===null)return;
  var dx=e.changedTouches[0].clientX-tx0, dy=e.changedTouches[0].clientY-ty0;
  if(Math.abs(dx)>80&&Math.abs(dy)<60){
    if(dx<0&&curTab<TABS.length-1)go(curTab+1);
    if(dx>0&&curTab>0)go(curTab-1);
  }
  tx0=null;
},{passive:true});
// напоминания пока приложение открыто
setInterval(function(){
  if(!("Notification" in window)||Notification.permission!=="granted")return;
  var now=new Date(), hm=("0"+now.getHours()).slice(-2)+":"+("0"+now.getMinutes()).slice(-2);
  var list=vitTimes();
  for(var i=0;i<list.length;i++){
    if(list[i].t===hm&&!st.vit[vitKey(i,today())]){
      try{new Notification("💊 "+list[i].n,{body:"Время принять добавку"});}catch(e){}
    }
  }
},30000);
// бэкап
function bindBackup(){
  $("bkDl").addEventListener("click",function(){
    var blob=new Blob([localStorage.zt_state||"{}"],{type:"application/json"});
    var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="zentarelka-backup.json";
    document.body.appendChild(a);a.click();setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href);},10000);
  });
  $("bkUp").addEventListener("click",function(){$("bkIn").click();});
  $("bkIn").addEventListener("change",function(){
    var f=this.files[0]; if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        JSON.parse(rd.result);
        localStorage.zt_state=rd.result;
        st=S();
        st.food=st.food||{};st.yoga=st.yoga||{};st.vit=st.vit||{};st.vtimes=st.vtimes||{};st.vinstr=st.vinstr||{};st.vt=st.vt||null;st.ration=st.ration||0;
        renderAll();toast("Данные восстановлены ✓");
      }catch(e){toast("Файл не распознан");}
    };
    rd.readAsText(f);
  });
}
</script>
